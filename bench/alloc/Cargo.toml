[package]
name = "allocbench"
version = "0.1.0"
edition = "2021"

# 同一个二进制，用 feature 切 global_allocator。
#   cargo run --release                        → 系统 malloc（glibc ptmalloc2）
#   cargo run --release --features jemalloc    → tikv-jemallocator
#   cargo run --release --features mimalloc    → mimalloc
[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", optional = true }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
