[package]
name = "labyard"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Declarative network lab orchestration for Proxmox VE"

[dependencies]
# ── HTTP ──
axum = { version = "0.8", features = ["ws", "macros"] }
# ttyd 反代：WS 用 tokio-tungstenite，HTTP 转发用 hyper 的 client
# （hyper 是 axum 的底层，已在依赖树里；不引 reqwest 是因为它的 idna→icu
#  链要求 rustc 1.88，而 Debian 13 自带的是 1.85。反代只需要明文 HTTP/1.1，
#  hyper 客户端栈就够，MSRV 也低）
tokio-tungstenite = "0.24"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# ── 异步 ──
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-trait = "0.1"

# ── 序列化 / 配置 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# 规格的增删改要**保留注释与格式**：手写的 YAML 被 web 表单一改就丢注释，
# 是那种"用一次就不敢再用"的功能。yaml-edit 基于 CST 就地编辑，只动目标节点。
yaml-edit = "0.3"
toml = "0.8"

# ── CLI / 日志 ──
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── 存储 ──
rusqlite = { version = "0.32", features = ["bundled"] }

# ── 嵌入静态资源 ──
rust-embed = "8"
mime_guess = "2"

# ── 认证 ──
scrypt = "0.11"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"

# ── 系统 ──
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# ── 错误 ──
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
