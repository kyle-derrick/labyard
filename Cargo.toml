[package]
name = "labyard"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Declarative network lab orchestration for Proxmox VE"

[dependencies]
# ── HTTP ──
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

# ── 异步 ──
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-trait = "0.1"

# ── 序列化 / 配置 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"

# ── CLI / 日志 ──
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── 存储 ──
rusqlite = { version = "0.32", features = ["bundled"] }

# ── 嵌入静态资源 ──
rust-embed = "8"
mime_guess = "2"

# ── 认证 ──
scrypt = "0.11"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"

# ── 系统 ──
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# ── 错误 ──
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
