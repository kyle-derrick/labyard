# 单 zone：最常见的起点
#   labyard apply -f examples/main.yaml --dry-run
defaults:
  cores: 2
  memory: 1024
  disk: 8
  template: debian-13-standard
  storage: local-lvm
  template_storage: local
  dns: [223.5.5.5, 119.29.29.29]

zones:
  main:
    uplink: wan
    v4: 10.10.1.0/24
    v6: auto          # 发 ULA /64 + NAT66；关掉写 off
    hosts:
      gateway:
        role: gateway
      analysis:
        role: analysis
        mirror: target
        provisioner: apt-mirror
      server1:
        role: server
        mirror: source
      client1:
        role: client
